name: Validar documentación
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validar árbol y enlaces locales
        run: python3 scripts/validate-repository.py
      - name: Sintaxis Bash (sin ejecutar scripts)
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Impedir archivos .env versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v -E '(^|/)\.env(\.[A-Za-z0-9_-]+)?\.example$'; then
            echo 'No publicar secretos .env'; exit 1
          fi
