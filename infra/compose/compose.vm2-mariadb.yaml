services:
  db:
    image: mariadb:11.4.13
    restart: unless-stopped

    ports:
      - "192.168.56.104:3306:3306"

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15

  moodle:
    image: oksigenia/moodle:4.5.15
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "192.168.56.104:8080:8080"

    environment:
      MOODLE_URL: https://aulavirtual.ctcr
      MOODLE_SSL_PROXY: "yes"
      MOODLE_DB_TYPE: mariadb
      MOODLE_DB_HOST: 192.168.56.104
      MOODLE_DB_PORT: "3306"
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: ${DB_PASSWORD}
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_SITE_NAME: Colegio Tecnico
      MOODLE_SITE_SHORTNAME: Colegio
      MOODLE_LANG: es
      MOODLE_TIMEZONE: America/Costa_Rica

    volumes:
      - moodle_code:/var/www/moodle
      - moodle_data:/var/www/moodledata

volumes:
  mariadb_data:
  moodle_code:
  moodle_data:
