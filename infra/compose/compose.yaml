# MODELO OBJETIVO, no el compose exacto de una VM existente.
services:
  db:
    image: ${MARIADB_IMAGE:?Definir MARIADB_IMAGE en .env}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD}
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - backend
    # No publicar el puerto 3306 al host.

  moodle:
    image: ${MOODLE_IMAGE:?Definir MOODLE_IMAGE en .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MOODLE_BIND_IP:-127.0.0.1}:${MOODLE_BIND_PORT:-8080}:8080"
    environment:
      MOODLE_URL: ${MOODLE_URL:?Definir MOODLE_URL}
      MOODLE_DB_TYPE: mariadb
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      MOODLE_SSL_PROXY: ${MOODLE_SSL_PROXY:-auto}
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?Definir MOODLE_ADMIN_PASSWORD}
      MOODLE_SITE_NAME: Colegio Técnico
      MOODLE_SITE_SHORTNAME: Colegio
      MOODLE_LANG: es
      MOODLE_TIMEZONE: America/Costa_Rica
    volumes:
      - moodle_code:/var/www/moodle
      - moodle_data:/var/www/moodledata
    networks:
      - backend
    # Cron interno de la imagen Oksigenia es distinto del Cron del host.

networks:
  backend:
    driver: bridge

volumes:
  mariadb_data:
  moodle_code:
  moodle_data:
